name: Deploy Nitwebs to Hostinger via SSH Exec

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy via SSH Command
    runs-on: ubuntu-latest
    steps:
      - name: SSH Command Pull & Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script: |
            cd ~/public_html || cd ~/domains/*/public_html || exit 1
            git pull origin main || git fetch --all && git reset --hard origin/main
