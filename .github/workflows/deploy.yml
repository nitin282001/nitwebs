name: Deploy Nitwebs to Hostinger via SSH / rsync

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy via SSH / rsync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy Frontend Assets via SSH rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 65002 }}
          PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SOURCE: "dist/"
          TARGET: "public_html/"
          ARGS: "-avz --delete"

      - name: Deploy API Backend via SSH rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 65002 }}
          PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SOURCE: "api/"
          TARGET: "public_html/api/"
          EXCLUDE: "/uploads/, config.php"
          ARGS: "-avz"
